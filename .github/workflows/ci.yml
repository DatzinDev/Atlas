name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate feature to develop to main
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = main ] && { [ "$HEAD_REF" != develop ] || [ "$HEAD_REPO" != "$REPOSITORY" ]; }; then
            echo "Releases to main must come from this repository's develop branch."
            exit 1
          fi
          if [ "$BASE_REF" = develop ] && { [ "$HEAD_REF" = main ] || [ "$HEAD_REF" = master ]; }; then
            echo "Work branches must merge into develop before release."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_test
      PGPASSWORD: atlas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,export]"

      - name: Seed
        run: psql "$ATLAS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/seed.sql

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy src/

      - name: Tests
        run: pytest -v
