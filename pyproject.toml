[project]
name = "atlas-geo"
version = "0.1.0"
description = "Publish PostGIS layers over WMS and WFS from a FastAPI application"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "psycopg[binary,pool]>=3.1",
    "shapely>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
export = ["fiona>=1.9"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"
# Docs are Spanish prose with illustrative snippets; they are not part of the codebase.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["atlas"]
