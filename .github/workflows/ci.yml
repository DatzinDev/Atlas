name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format Rust
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: cargo test --locked

  gitflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate feature to develop to main
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = main ] && { [ "$HEAD_REF" != develop ] || [ "$HEAD_REPO" != "$REPOSITORY" ]; }; then
            echo "Releases to main must come from this repository's develop branch."
            exit 1
          fi
          if [ "$BASE_REF" = develop ] && { [ "$HEAD_REF" = main ] || [ "$HEAD_REF" = master ]; }; then
            echo "Work branches must merge into develop before release."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_test
      PGPASSWORD: atlas

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install -e ".[dev,export]" build twine pip-audit==2.10.1

      - name: Seed
        run: psql "$ATLAS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/seed.sql

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Types
        run: mypy src/

      - name: Tests
        run: pytest -v

      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable --progress-spinner off

      - name: Build and validate wheel and sdist
        run: |
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
